<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A0D"/>
      <stop offset="100%" stop-color="#EB1000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EB1000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Canvas -->
  <rect width="128" height="128" rx="28" fill="#141414" stroke="#262626" stroke-width="2"/>
  
  <!-- Inner Brand Tile with Glow -->
  <rect x="16" y="16" width="96" height="96" rx="20" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Official Adobe Monogram Geometry -->
  <polygon points="64,28 34,96 52,96" fill="#FFFFFF"/>
  <polygon points="64,28 94,96 76,96" fill="#FFFFFF"/>
  <polygon points="56,76 64,57 72,76" fill="#FFFFFF"/>
  
  <!-- GEO Search Engine Orbit Ring -->
  <circle cx="98" cy="30" r="8" fill="#27C281" stroke="#141414" stroke-width="2.5"/>
</svg>
