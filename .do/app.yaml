name: omniaudit-geo
region: nyc
services:
  - name: web
    image:
      registry_type: GHCR
      registry: sh20raj
      repository: omniaudit-geo
      tag: stable
      digest: sha256:5feefc02727159d5b7f6a35e513fcd4413dfdd3cbceac21fa09d969604dfdb11
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
