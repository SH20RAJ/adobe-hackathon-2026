name: omniaudit-geo
region: nyc
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
