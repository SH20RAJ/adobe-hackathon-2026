name: omniaudit-geo
region: nyc
services:
  - name: web
    image:
      registry_type: GHCR
      registry: sh20raj
      repository: omniaudit-geo
      tag: stable
      digest: sha256:9ae27e45c89599172bb5b98118e582ddf2f54276163797f13ec6f65e49282647
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
