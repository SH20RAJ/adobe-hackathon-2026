version: '3.8'

services:
  omniaudit-geo:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniaudit-geo:latest
    container_name: omniaudit-geo
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
